<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>沖縄・きれいなトイレマップ</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <style>
    :root { --blue:#1769aa; --navy:#123047; --paper:#fffdf9; --line:#dce5e8; --ink:#1d2b33; --muted:#60717b; --gold:#ee9b00; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif; background:#eef4f5; }
    header { padding:16px 20px; background:var(--navy); color:white; display:flex; align-items:center; justify-content:space-between; gap:16px; }
    h1 { margin:0; font-size:20px; } .subtitle { margin:3px 0 0; font-size:12px; color:#d5e6ee; }
    main { height:calc(100vh - 76px); min-height:560px; display:grid; grid-template-columns:360px 1fr; }
    aside { background:var(--paper); padding:18px; overflow:auto; border-right:1px solid var(--line); }
    #map { width:100%; height:100%; min-height:400px; }
    .button { border:0; border-radius:8px; padding:10px 14px; font:inherit; font-weight:700; cursor:pointer; }
    .primary { background:var(--blue); color:white; width:100%; } .secondary { background:#e6eff2; color:var(--navy); }
    .hint, .empty { color:var(--muted); font-size:13px; line-height:1.5; }
    .form-card { margin-top:14px; padding:14px; border:1px solid var(--line); border-radius:10px; background:#fff; }
    .form-card[hidden] { display:none; }
    h2 { font-size:15px; margin:0 0 10px; } label { display:block; margin-top:10px; font-size:13px; font-weight:700; }
    input, textarea { width:100%; margin-top:5px; padding:9px; border:1px solid #b9c7cb; border-radius:7px; font:inherit; }
    textarea { resize:vertical; min-height:68px; } .stars { display:flex; gap:2px; margin-top:5px; }
    .star { border:0; padding:1px 2px; background:transparent; color:#c8d1d4; font-size:28px; cursor:pointer; line-height:1; } .star.active { color:var(--gold); }
    .form-actions { display:flex; gap:8px; margin-top:14px; } .form-actions .button { flex:1; }
    .list-heading { display:flex; justify-content:space-between; align-items:baseline; margin:22px 0 8px; } .list-heading h2 { margin:0; }
    .filters { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; } .filter { border:1px solid #b9c7cb; border-radius:999px; background:#fff; color:var(--navy); padding:5px 8px; font:inherit; font-size:12px; cursor:pointer; } .filter.active { background:var(--blue); border-color:var(--blue); color:#fff; }
    .count { font-size:12px; color:var(--muted); } .place { width:100%; text-align:left; padding:12px 0; border:0; border-top:1px solid var(--line); background:transparent; cursor:pointer; font:inherit; }
    .place:last-child { border-bottom:1px solid var(--line); } .place-name { font-weight:700; } .rating { color:var(--gold); margin-top:3px; letter-spacing:1px; } .comment { color:var(--muted); font-size:13px; margin-top:4px; line-height:1.4; }
    .map-note { background:white; padding:7px 10px; border-radius:5px; box-shadow:0 1px 4px #7777; font-size:12px; }
    .popup-name { margin:0 0 4px; font-size:15px; } .popup-meta { color:#596a73; font-size:12px; margin:3px 0; } .popup-comment { margin:7px 0; line-height:1.4; } .popup-buttons { display:flex; gap:6px; margin-top:8px; } .popup-buttons button { border:0; background:#e4eff3; padding:5px 8px; border-radius:4px; cursor:pointer; }
    @media (max-width:720px) { header { padding:12px 14px; } main { display:flex; height:auto; min-height:0; flex-direction:column-reverse; } aside { max-height:58vh; border-right:0; border-top:1px solid var(--line); } #map { height:42vh; min-height:280px; } }
  </style>
</head>
<body>
  <header><div><h1>沖縄・きれいなトイレマップ</h1><p class="subtitle">自分だけのトイレ評価を記録</p></div><button id="locateButton" class="button secondary">現在地へ</button></header>
  <main>
    <aside>
      <button id="addButton" class="button primary">＋ 場所を追加</button>
      <p id="instruction" class="hint">「場所を追加」を押し、地図上で訪れた場所をクリックしてください。</p>
      <section id="formCard" class="form-card" hidden>
        <h2 id="formTitle">評価を登録</h2>
        <form id="placeForm">
          <input id="placeId" type="hidden">
          <input id="lat" type="hidden"><input id="lng" type="hidden">
          <label>場所の名前<input id="name" required maxlength="80" placeholder="例：道の駅 許田"></label>
          <label>きれいさ<span class="stars" id="stars" role="radiogroup" aria-label="きれいさ評価"></span><input id="rating" type="hidden" value="5"></label>
          <label>一言コメント<textarea id="comment" maxlength="240" placeholder="例：清掃が行き届いていて、においも気にならなかった"></textarea></label>
          <label>訪問日<input id="visitedAt" type="date"></label>
          <div class="form-actions"><button class="button primary" type="submit">保存する</button><button id="cancelButton" class="button secondary" type="button">キャンセル</button></div>
        </form>
      </section>
      <div class="list-heading"><h2>記録した場所</h2><span id="count" class="count"></span></div>
      <div id="filterControls" class="filters" aria-label="評価で絞り込み"></div>
      <div id="placeList"></div>
    </aside>
    <div id="map" aria-label="沖縄県のトイレ評価地図"></div>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const STORAGE_KEY = 'okinawa-clean-toilet-map-v1';
    const map = L.map('map', { zoomControl: false }).setView([26.35, 127.82], 9);
    L.control.zoom({ position:'bottomright' }).addTo(map);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'&copy; OpenStreetMap contributors' }).addTo(map);
    const note = L.control({position:'topright'}); note.onAdd = () => { const d=L.DomUtil.create('div','map-note'); d.textContent='ピンを押すと詳細を表示'; return d; }; note.addTo(map);
    let places = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    let markers = []; let adding = false; let selectedPoint = null; let selectedRating = 'all';
    const el = id => document.getElementById(id);
    const esc = text => String(text || '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    function stars(value) { return '★'.repeat(value) + '☆'.repeat(5-value); }
    function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(places)); }
    function markerIcon(rating) { return L.divIcon({ className:'', iconSize:[34,42], iconAnchor:[17,40], popupAnchor:[0,-36], html:`<div style="width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#1769aa;border:2px solid #fff;box-shadow:0 2px 5px #3458;display:grid;place-items:center"><span style="transform:rotate(45deg);color:#fff;font:bold 13px sans-serif">${rating}★</span></div>` }); }
    function renderStars(value) { el('stars').innerHTML = [1,2,3,4,5].map(n => `<button type="button" class="star ${n<=value?'active':''}" data-value="${n}" aria-label="${n}点" aria-pressed="${n===value}">★</button>`).join(''); }
    function closeForm() { el('formCard').hidden=true; adding=false; selectedPoint=null; el('instruction').textContent='「場所を追加」を押し、地図上で訪れた場所をクリックしてください。'; }
    function openForm(point, place) { selectedPoint=point; el('formCard').hidden=false; el('formTitle').textContent=place?'評価を編集':'評価を登録'; el('placeId').value=place?.id || ''; el('lat').value=point.lat; el('lng').value=point.lng; el('name').value=place?.name || ''; el('rating').value=place?.rating || 5; el('comment').value=place?.comment || ''; el('visitedAt').value=place?.visitedAt || new Date().toISOString().slice(0,10); renderStars(Number(el('rating').value)); el('name').focus(); }
    function render() {
      markers.forEach(m => map.removeLayer(m)); markers=[];
      const sorted=[...places].sort((a,b) => b.updatedAt-a.updatedAt);
      const filtered=selectedRating === 'all' ? sorted : sorted.filter(p => p.rating === Number(selectedRating));
      el('count').textContent=`${filtered.length}/${sorted.length}件`;
      el('filterControls').innerHTML = ['all',5,4,3,2,1].map(value => { const label=value === 'all' ? 'すべて' : `★${value}`; return `<button class="filter ${String(value) === String(selectedRating) ? 'active' : ''}" type="button" data-rating="${value}" aria-pressed="${String(value) === String(selectedRating)}">${label}</button>`; }).join('');
      el('placeList').innerHTML = filtered.length ? filtered.map(p => `<button class="place" data-id="${p.id}"><div class="place-name">${esc(p.name)}</div><div class="rating">${stars(p.rating)}</div><div class="comment">${esc(p.comment || 'コメントなし')}</div></button>`).join('') : `<p class="empty">${sorted.length ? 'この評価の記録はありません。' : 'まだ記録はありません。地図から最初の場所を追加しましょう。'}</p>`;
      places.forEach(p => { const m=L.marker([p.lat,p.lng],{icon:markerIcon(p.rating)}).addTo(map); m.bindPopup(`<h3 class="popup-name">${esc(p.name)}</h3><div class="rating">${stars(p.rating)}</div><p class="popup-comment">${esc(p.comment || 'コメントなし')}</p><p class="popup-meta">訪問日：${esc(p.visitedAt || '未登録')}</p><div class="popup-buttons"><button onclick="editPlace('${p.id}')">編集</button><button onclick="deletePlace('${p.id}')">削除</button></div>`); markers.push(m); });
    }
    window.editPlace = id => { const p=places.find(x=>x.id===id); if(p) { map.closePopup(); map.setView([p.lat,p.lng], Math.max(map.getZoom(),14)); openForm(L.latLng(p.lat,p.lng),p); } };
    window.deletePlace = id => { const p=places.find(x=>x.id===id); if(p && confirm(`「${p.name}」の記録を削除しますか？`)) { places=places.filter(x=>x.id!==id); save(); render(); } };
    el('addButton').onclick = () => { closeForm(); adding=true; el('instruction').textContent='地図上で場所をクリックしてください。入力フォームが開きます。'; };
    el('cancelButton').onclick = closeForm;
    el('stars').onclick = event => { const b=event.target.closest('[data-value]'); if(b) { el('rating').value=b.dataset.value; renderStars(Number(b.dataset.value)); } };
    map.on('click', event => { if(adding) { openForm(event.latlng); adding=false; el('instruction').textContent='場所の情報を入力して保存してください。'; } });
    el('placeForm').onsubmit = event => { event.preventDefault(); const id=el('placeId').value; const item={ id:id||crypto.randomUUID(), lat:Number(el('lat').value), lng:Number(el('lng').value), name:el('name').value.trim(), rating:Number(el('rating').value), comment:el('comment').value.trim(), visitedAt:el('visitedAt').value, updatedAt:Date.now() }; if(id) places=places.map(p=>p.id===id?item:p); else places.push(item); save(); render(); closeForm(); map.setView([item.lat,item.lng],15); };
    el('placeList').onclick = event => { const b=event.target.closest('[data-id]'); const p=b && places.find(x=>x.id===b.dataset.id); if(p) { map.setView([p.lat,p.lng],15); markers[places.indexOf(p)].openPopup(); } };
    el('filterControls').onclick = event => { const button=event.target.closest('[data-rating]'); if(button) { selectedRating=button.dataset.rating; render(); } };
    el('locateButton').onclick = () => { if(!navigator.geolocation) return alert('このブラウザでは現在地を取得できません。'); navigator.geolocation.getCurrentPosition(pos => map.setView([pos.coords.latitude,pos.coords.longitude],15), () => alert('現在地を取得できませんでした。位置情報の許可をご確認ください。')); };
    render();
    window.addEventListener('load', () => setTimeout(() => map.invalidateSize(), 100));
    window.addEventListener('resize', () => map.invalidateSize());
  </script>
</body>
</html>
