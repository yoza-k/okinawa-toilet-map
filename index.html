<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Okinawa Toilet Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <style>
    :root{--blue:#1769aa;--navy:#123047;--paper:#fffdf9;--line:#dce5e8;--ink:#1d2b33;--muted:#60717b;--gold:#ee9b00}
    *{box-sizing:border-box} body{margin:0;background:#eef4f5;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
    header{align-items:center;background:var(--navy);color:#fff;display:flex;gap:16px;justify-content:space-between;padding:16px 20px} h1{font-size:20px;margin:0}.subtitle{color:#d5e6ee;font-size:12px;margin:3px 0 0}
    main{display:grid;grid-template-columns:360px minmax(0,1fr);height:calc(100vh - 76px);min-height:560px}aside{background:var(--paper);border-right:1px solid var(--line);overflow:auto;padding:18px}#map{height:100%;min-height:400px;width:100%}
    .button{border:0;border-radius:8px;cursor:pointer;font:inherit;font-weight:700;padding:10px 14px}.primary{background:var(--blue);color:#fff;width:100%}.secondary{background:#e6eff2;color:var(--navy)}.hint,.empty{color:var(--muted);font-size:13px;line-height:1.5}
    .form-card{background:#fff;border:1px solid var(--line);border-radius:10px;margin-top:14px;padding:14px}.form-card[hidden]{display:none}h2{font-size:15px;margin:0 0 10px}label{display:block;font-size:13px;font-weight:700;margin-top:10px}input,textarea{border:1px solid #b9c7cb;border-radius:7px;font:inherit;margin-top:5px;padding:9px;width:100%}textarea{min-height:68px;resize:vertical}.stars{display:flex;gap:2px;margin-top:5px}.star{background:transparent;border:0;color:#c8d1d4;cursor:pointer;font-size:28px;line-height:1;padding:1px 2px}.star.active{color:var(--gold)}.form-actions{display:flex;gap:8px;margin-top:14px}.form-actions .button{flex:1}
    .fairy-card{align-items:center;background:#f2f8fb;border:1px solid #d6e6ed;border-radius:12px;display:flex;gap:10px;margin:14px 0 18px;min-height:118px;overflow:hidden;padding:10px 12px}.fairy-copy{flex:1;min-width:0}.fairy-title{color:var(--navy);font-size:13px;font-weight:700;margin:0 0 4px}.fairy-status{color:var(--muted);font-size:12px;line-height:1.4;margin:0}.fairy{height:94px;position:relative;width:98px;flex:0 0 98px}.fairy-float{animation:float 2.7s ease-in-out infinite;inset:2px 0 0;position:absolute}.halo{border:3px solid #f2bd2e;border-radius:50%;height:17px;left:39px;position:absolute;top:0;width:28px}.wing{background:#d8f1fa;border:2px solid #82c9df;border-radius:70% 20% 70% 20%;height:30px;position:absolute;top:31px;width:26px}.wing.left{left:9px;transform:rotate(-27deg)}.wing.right{right:9px;transform:scaleX(-1) rotate(-27deg)}.face{background:#ffe2c8;border:2px solid #d58c57;border-radius:50%;height:38px;left:30px;position:absolute;top:18px;width:38px}.eyes{font-size:14px;left:9px;letter-spacing:4px;position:absolute;top:8px}.mouth{border-bottom:2px solid #a95f50;border-radius:50%;height:8px;left:13px;position:absolute;top:21px;width:11px}.toilet{background:#fff;border:3px solid #77abc1;border-radius:9px 9px 18px 18px;height:37px;left:25px;position:absolute;top:52px;width:48px}.toilet:before{background:#dff3f8;border:3px solid #77abc1;border-radius:50%;content:"";height:16px;left:5px;position:absolute;top:-10px;width:31px}.spark{color:#f1a900;font-size:15px;opacity:0;position:absolute}.spark.a{left:3px;top:10px}.spark.b{right:0;top:49px}.fairy.s5 .fairy-float{animation:float 1.8s ease-in-out infinite}.fairy.s5 .spark{animation:twinkle 1.1s ease-in-out infinite;opacity:1}.fairy.s5 .spark.b{animation-delay:.45s}.fairy.s4 .fairy-float{animation:wobble 2.1s ease-in-out infinite}.fairy.s3 .fairy-float{animation:float 3.4s ease-in-out infinite}.fairy.s2 .mouth{border-radius:0;border-bottom:0;border-top:2px solid #a95f50;top:24px}.fairy.s2 .fairy-float{animation:wobble 3.5s ease-in-out infinite}.fairy.s1 .eyes{letter-spacing:1px}.fairy.s1 .mouth{border-radius:0;border-bottom:0;border-top:2px solid #a95f50;top:24px;width:15px}.fairy.s1 .fairy-float{animation:droop 3s ease-in-out infinite}.fairy.s1 .wing{opacity:.55}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes wobble{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg) translateY(-3px)}}@keyframes droop{0%,100%{transform:translateY(4px) rotate(-5deg)}50%{transform:translateY(8px) rotate(3deg)}}@keyframes twinkle{0%,100%{transform:scale(.6) rotate(0);opacity:.2}50%{transform:scale(1.25) rotate(20deg);opacity:1}}
    #fairy.fairy{flex:0 0 112px;height:112px;position:relative;width:112px}.fairy-art{animation:float 3.4s ease-in-out infinite;display:block;height:112px;object-fit:contain;width:112px}.fairy.s5 .fairy-art{animation:fairy-joy 1.6s ease-in-out infinite;filter:drop-shadow(0 4px 5px #f2bd2e88)}.fairy.s4 .fairy-art{animation:wobble 2.2s ease-in-out infinite}.fairy.s3 .fairy-art{animation:float 3.4s ease-in-out infinite}.fairy.s2 .fairy-art{animation:wobble 3.5s ease-in-out infinite;filter:saturate(.68) brightness(.94)}.fairy.s1 .fairy-art{animation:droop 3s ease-in-out infinite;filter:grayscale(.55) saturate(.55) brightness(.88);opacity:.82}@keyframes fairy-joy{0%,100%{transform:translateY(0) rotate(-2deg) scale(1)}50%{transform:translateY(-9px) rotate(3deg) scale(1.06)}}
    .list-heading{align-items:baseline;display:flex;justify-content:space-between;margin:12px 0 8px}.list-heading h2{margin:0}.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.filter{background:#fff;border:1px solid #b9c7cb;border-radius:999px;color:var(--navy);cursor:pointer;font:inherit;font-size:12px;padding:5px 8px}.filter.active{background:var(--blue);border-color:var(--blue);color:#fff}.count{color:var(--muted);font-size:12px}.place{background:transparent;border:0;border-top:1px solid var(--line);cursor:pointer;font:inherit;padding:12px 0;text-align:left;width:100%}.place:last-child{border-bottom:1px solid var(--line)}.place-name{font-weight:700}.rating{color:var(--gold);letter-spacing:1px;margin-top:3px}.comment{color:var(--muted);font-size:13px;line-height:1.4;margin-top:4px}.map-note{background:#fff;border-radius:5px;box-shadow:0 1px 4px #7777;font-size:12px;padding:7px 10px}.popup-name{font-size:15px;margin:0 0 4px}.popup-meta{color:#596a73;font-size:12px;margin:3px 0}.popup-comment{line-height:1.4;margin:7px 0}.popup-buttons{display:flex;gap:6px;margin-top:8px}.popup-buttons button{background:#e4eff3;border:0;border-radius:4px;cursor:pointer;padding:5px 8px}
    @media(max-width:720px){header{padding:12px 14px}main{display:flex;flex-direction:column-reverse;height:auto;min-height:0}aside{border-right:0;border-top:1px solid var(--line);max-height:58vh}#map{height:42vh;min-height:280px}.fairy-card{min-height:104px}}
  </style>
</head>
<body>
  <header><div><h1>沖縄・きれいなトイレマップ</h1><p class="subtitle">自分だけのトイレ評価を記録</p></div><button id="locateButton" class="button secondary">現在地へ</button></header>
  <main><aside>
    <button id="addButton" class="button primary">＋ 場所を追加</button><p id="instruction" class="hint">「場所を追加」を押し、地図上で訪れた場所をクリックしてください。</p>
    <section id="formCard" class="form-card" hidden><h2 id="formTitle">評価を登録</h2><form id="placeForm"><input id="placeId" type="hidden"><input id="lat" type="hidden"><input id="lng" type="hidden"><label>場所の名前<input id="name" required maxlength="80" placeholder="例：道の駅 許田"></label><label>きれいさ<span class="stars" id="stars" role="radiogroup" aria-label="きれいさ評価"></span><input id="rating" type="hidden" value="5"></label><label>一言コメント<textarea id="comment" maxlength="240" placeholder="例：清掃が行き届いていて、においも気にならなかった"></textarea></label><label>訪問日<input id="visitedAt" type="date"></label><div class="form-actions"><button class="button primary" type="submit">保存する</button><button id="cancelButton" class="button secondary" type="button">キャンセル</button></div></form></section>
    <section class="fairy-card" aria-live="polite"><div id="fairy" class="fairy s5"><img id="fairyArt" class="fairy-art" src="20260818_toilet-fairy-rating-5.png" alt="星5のトイレ妖精"></div><div class="fairy-copy"><p class="fairy-title">トイレの妖精</p><p id="fairyStatus" class="fairy-status"></p></div></section>
    <div class="list-heading"><h2>記録した場所</h2><span id="count" class="count"></span></div><div id="filterControls" class="filters" aria-label="評価で絞り込み"></div><div id="placeList"></div>
  </aside><div id="map" aria-label="沖縄県のトイレ評価地図"></div></main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const t = s => JSON.parse('"' + s + '"');
    const T = { add:t('\\u5834\\u6240\\u3092\\u8ffd\\u52a0'), click:t('\\u5730\\u56f3\\u4e0a\\u3067\\u5834\\u6240\\u3092\\u30af\\u30ea\\u30c3\\u30af\\u3057\\u3066\\u304f\\u3060\\u3055\\u3044\\u3002'), fill:t('\\u5834\\u6240\\u306e\\u60c5\\u5831\\u3092\\u5165\\u529b\\u3057\\u3066\\u4fdd\\u5b58\\u3057\\u3066\\u304f\\u3060\\u3055\\u3044\\u3002'), all:t('\\u3059\\u3079\\u3066'), none:t('\\u307e\\u3060\\u8a18\\u9332\\u306f\\u3042\\u308a\\u307e\\u305b\\u3093\\u3002'), noMatch:t('\\u3053\\u306e\\u8a55\\u4fa1\\u306e\\u8a18\\u9332\\u306f\\u3042\\u308a\\u307e\\u305b\\u3093\\u3002'), noComment:t('\\u30b3\\u30e1\\u30f3\\u30c8\\u306a\\u3057'), visit:t('\\u8a2a\\u554f\\u65e5\\uff1a'), edit:t('\\u7de8\\u96c6'), del:t('\\u524a\\u9664'), deleteAsk:t('\\u306e\\u8a18\\u9332\\u3092\\u524a\\u9664\\u3057\\u307e\\u3059\\u304b\\uff1f'), tip:t('\\u30d4\\u30f3\\u3092\\u62bc\\u3059\\u3068\\u8a73\\u7d30\\u3092\\u8868\\u793a'), gpsNo:t('\\u3053\\u306e\\u30d6\\u30e9\\u30a6\\u30b6\\u3067\\u306f\\u73fe\\u5728\\u5730\\u3092\\u53d6\\u5f97\\u3067\\u304d\\u307e\\u305b\\u3093\\u3002'), gpsFail:t('\\u73fe\\u5728\\u5730\\u3092\\u53d6\\u5f97\\u3067\\u304d\\u307e\\u305b\\u3093\\u3067\\u3057\\u305f\\u3002') };
    const S='okinawa-clean-toilet-map-v1',el=id=>document.getElementById(id),esc=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),stars=n=>'&#9733;'.repeat(n)+'&#9734;'.repeat(5-n);
    const map=L.map('map',{zoomControl:false}).setView([26.35,127.82],9);L.control.zoom({position:'bottomright'}).addTo(map);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);const note=L.control({position:'topright'});note.onAdd=()=>{const d=L.DomUtil.create('div','map-note');d.textContent=T.tip;return d};note.addTo(map);
    let places=JSON.parse(localStorage.getItem(S)||'[]'),markers=[],adding=false,selectedRating='all';
    function save(){localStorage.setItem(S,JSON.stringify(places))} function icon(r){return L.divIcon({className:'',iconSize:[34,42],iconAnchor:[17,40],popupAnchor:[0,-36],html:`<div style="width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#1769aa;border:2px solid #fff;box-shadow:0 2px 5px #3458;display:grid;place-items:center"><span style="transform:rotate(45deg);color:#fff;font:bold 13px sans-serif">${r}&#9733;</span></div>`})}
    function formStars(v){el('stars').innerHTML=[1,2,3,4,5].map(n=>`<button type="button" class="star ${n<=v?'active':''}" data-value="${n}" aria-label="${n}" aria-pressed="${n===v}">&#9733;</button>`).join('')}
    function closeForm(){el('formCard').hidden=true;adding=false;el('instruction').textContent='\u300c'+T.add+'\u300d\u3092\u62bc\u3057\u3001'+T.click}
    function openForm(point,p){el('formCard').hidden=false;el('formTitle').textContent=p?T.edit:t('\\u8a55\\u4fa1\\u3092\\u767b\\u9332');el('placeId').value=p?.id||'';el('lat').value=point.lat;el('lng').value=point.lng;el('name').value=p?.name||'';el('rating').value=p?.rating||5;el('comment').value=p?.comment||'';el('visitedAt').value=p?.visitedAt||new Date().toISOString().slice(0,10);formStars(+el('rating').value);el('name').focus()}
    function fairy(r,latest){const f=el('fairy');f.className='fairy s'+r;el('fairyArt').src='20260818_toilet-fairy-rating-'+r+'.png';el('fairyArt').alt='星'+r+'のトイレ妖精';const messages={5:t('\\u26055\\u306e\\u8f1d\\u304d\\uff01\\u304d\\u308c\\u3044\\u306a\\u30c8\\u30a4\\u30ec\\u306b\\u5927\\u559c\\u3073\\u3002'),4:t('\\u26054\\u3067\\u306b\\u3053\\u306b\\u3053\\u3002\\u6c17\\u6301\\u3061\\u3088\\u304f\\u4f7f\\u3048\\u305d\\u3046\\u3002'),3:t('\\u26053\\u3002\\u4eca\\u65e5\\u3082\\u8a18\\u9332\\u304a\\u3064\\u304b\\u308c\\u3055\\u307e\\u3002'),2:t('\\u26052\\u3002\\u3082\\u3046\\u5c11\\u3057\\u304d\\u308c\\u3044\\u3060\\u3068\\u3046\\u308c\\u3057\\u3044\\u306a\\u3002'),1:t('\\u26051\\u3002\\u6b8b\\u5ff5\\u3002\\u6b21\\u306f\\u6c17\\u6301\\u3061\\u3088\\u3044\\u5834\\u6240\\u3092\\u898b\\u3064\\u3051\\u3088\\u3046\\u3002')};el('fairyStatus').textContent=places.length?(selectedRating==='all'?t('\\u6700\\u8fd1\\u306e\\u8a18\\u9332\\uff1a')+messages[latest]:messages[r]):t('\\u30c8\\u30a4\\u30ec\\u306e\\u8a55\\u4fa1\\u3092\\u8a18\\u9332\\u3059\\u308b\\u3068\\u3001\\u5996\\u7cbe\\u304c\\u5909\\u5316\\u3059\\u308b\\u3088\\u3002')}
    function render(){markers.forEach(m=>map.removeLayer(m));markers=[];const sorted=[...places].sort((a,b)=>b.updatedAt-a.updatedAt),filtered=selectedRating==='all'?sorted:sorted.filter(p=>p.rating===+selectedRating),latest=sorted[0]?.rating||5,r=selectedRating==='all'?latest:+selectedRating;fairy(r,latest);el('count').textContent=`${filtered.length}/${sorted.length}\u4ef6`;el('filterControls').innerHTML=['all',5,4,3,2,1].map(v=>`<button class="filter ${String(v)===String(selectedRating)?'active':''}" type="button" data-rating="${v}" aria-pressed="${String(v)===String(selectedRating)}">${v==='all'?T.all:'&#9733;'+v}</button>`).join('');el('placeList').innerHTML=filtered.length?filtered.map(p=>`<button class="place" data-id="${p.id}"><div class="place-name">${esc(p.name)}</div><div class="rating">${stars(p.rating)}</div><div class="comment">${esc(p.comment||T.noComment)}</div></button>`).join(''):`<p class="empty">${sorted.length?T.noMatch:T.none}</p>`;places.forEach(p=>{const m=L.marker([p.lat,p.lng],{icon:icon(p.rating)}).addTo(map);m.bindPopup(`<h3 class="popup-name">${esc(p.name)}</h3><div class="rating">${stars(p.rating)}</div><p class="popup-comment">${esc(p.comment||T.noComment)}</p><p class="popup-meta">${T.visit}${esc(p.visitedAt||'')}</p><div class="popup-buttons"><button onclick="editPlace('${p.id}')">${T.edit}</button><button onclick="deletePlace('${p.id}')">${T.del}</button></div>`);markers.push(m)})}
    window.editPlace=id=>{const p=places.find(x=>x.id===id);if(p){map.closePopup();map.setView([p.lat,p.lng],Math.max(map.getZoom(),14));openForm(L.latLng(p.lat,p.lng),p)}};window.deletePlace=id=>{const p=places.find(x=>x.id===id);if(p&&confirm(''+p.name+T.deleteAsk)){places=places.filter(x=>x.id!==id);save();render()}};
    el('addButton').onclick=()=>{closeForm();adding=true;el('instruction').textContent=T.click};el('cancelButton').onclick=closeForm;el('stars').onclick=e=>{const b=e.target.closest('[data-value]');if(b){el('rating').value=b.dataset.value;formStars(+b.dataset.value)}};map.on('click',e=>{if(adding){openForm(e.latlng);adding=false;el('instruction').textContent=T.fill}});el('placeForm').onsubmit=e=>{e.preventDefault();const id=el('placeId').value,p={id:id||crypto.randomUUID(),lat:+el('lat').value,lng:+el('lng').value,name:el('name').value.trim(),rating:+el('rating').value,comment:el('comment').value.trim(),visitedAt:el('visitedAt').value,updatedAt:Date.now()};places=id?places.map(x=>x.id===id?p:x):[...places,p];save();render();closeForm();map.setView([p.lat,p.lng],15)};el('placeList').onclick=e=>{const b=e.target.closest('[data-id]'),p=b&&places.find(x=>x.id===b.dataset.id);if(p){map.setView([p.lat,p.lng],15);markers[places.indexOf(p)].openPopup()}};el('filterControls').onclick=e=>{const b=e.target.closest('[data-rating]');if(b){selectedRating=b.dataset.rating;render()}};el('locateButton').onclick=()=>{if(!navigator.geolocation)return alert(T.gpsNo);navigator.geolocation.getCurrentPosition(p=>map.setView([p.coords.latitude,p.coords.longitude],15),()=>alert(T.gpsFail))};render();window.addEventListener('load',()=>setTimeout(()=>map.invalidateSize(),100));window.addEventListener('resize',()=>map.invalidateSize());
  </script>
</body>
</html>
